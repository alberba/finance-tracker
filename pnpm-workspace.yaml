allowBuilds:
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true
# Keep the native binaries for the Playwright Linux image too: macOS regenerates
# the committed `*-linux.png` snapshots inside it (scripts/e2e-visual-linux.sh).
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc
# Pins for transitive dependencies; Dependabot's groups don't revise them. Drop an entry only
# once the parent's own range resolves to a fixed version (check with `pnpm why <name>` and
# `pnpm audit:prod` without the pin).
overrides:
  brace-expansion: 5.0.12
  devalue: 5.9.3
  undici@7: 7.29.1
  undici@8: 8.10.2
  nanoid: 3.3.18
  picomatch: 2.3.2
  postcss: 8.5.26
  rollup: 4.59.0
  sharp: 0.35.5
  smol-toml: 1.9.1
  source-map-js: 1.2.2
  yaml: 2.8.3
  esbuild@0.18.20: 0.25.12
  fast-uri: 3.1.8
  browserslist: 4.28.7
  baseline-browser-mapping: ^2.11.0
  js-yaml: 4.3.2
  svgo: 4.1.0

patchedDependencies:
  # Dev-server only: retry idempotent requests when a pooled loopback connection
  # to workerd is torn down by a concurrent abort. Without it, `pnpm dev` returns
  # intermittent "fetch failed" 500s during E2E navigations.
  '@cloudflare/vite-plugin@1.63.1': patches/@cloudflare__vite-plugin@1.63.1.patch
  http-cache-semantics@4.2.0: patches/http-cache-semantics@4.2.0.patch

auditConfig:
  # Fixed by patchedDependencies above; npm audit cannot inspect local patches.
  # Remove this exception and the patch when upstream publishes a fixed release.
  ignoreGhsas:
    - GHSA-ch52-4w7c-c8xp
