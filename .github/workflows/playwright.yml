name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Quality and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit:prod
      - name: Lint
        run: pnpm lint
      - name: Astro check
        run: pnpm check
      - name: Vitest unit, component and integration coverage
        run: pnpm test:coverage
      - name: Verify local D1 migrations apply cleanly (v1 + v2)
        run: |
          pnpm d1:migrate:local
          pnpm d1:migrate:local:v2
      - name: Production build
        run: pnpm build

  smoke:
    name: PR smoke E2E
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Enable the test auth shim
        run: printf 'TEST_AUTH_ENABLED=true\nLEGACY_OWNER_EMAIL=legacy-owner@e2e.test\n' > .dev.vars
      - name: Run smoke E2E
        run: pnpm test:e2e:smoke --reporter=dot,html
      - name: Upload failure report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Full E2E shard ${{ matrix.shard }}/2
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Enable the test auth shim
        run: printf 'TEST_AUTH_ENABLED=true\nLEGACY_OWNER_EMAIL=legacy-owner@e2e.test\n' > .dev.vars
      - name: Run functional E2E shard
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2
      - name: Upload blob report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-e2e-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 7

  specialized-e2e:
    name: Visual and sync E2E
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Enable the test auth shim
        run: printf 'TEST_AUTH_ENABLED=true\nLEGACY_OWNER_EMAIL=legacy-owner@e2e.test\n' > .dev.vars
      - name: Run visual regression tests
        run: pnpm test:e2e:visual
      - name: Apply local D1 v2 migrations
        if: ${{ always() && !cancelled() }}
        run: pnpm d1:migrate:local:v2
      - name: Run sync-v2 E2E tests
        if: ${{ always() && !cancelled() }}
        run: pnpm test:e2e:sync-v2
      - name: Upload visual blob report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-visual
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload sync-v2 blob report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-sync-v2
          path: blob-report-sync-v2/
          if-no-files-found: ignore
          retention-days: 7

  e2e-report:
    name: Merge failed Playwright report
    if: >-
      ${{
        always() &&
        github.event_name != 'pull_request' &&
        (needs.e2e.result == 'failure' || needs.specialized-e2e.result == 'failure')
      }}
    needs: [e2e, specialized-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download blob reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload HTML report
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
