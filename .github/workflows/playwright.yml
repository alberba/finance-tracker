name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
    # Only prose is exempt; scripts and configuration under docs still need CI.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI: true
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# Reuse green PR validation only for an identical Git tree; otherwise validate the push.
# Extensive browser regression belongs to browser-regression.yml, off the delivery path.
jobs:
  reuse:
    name: Reuse validated PR
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reused: ${{ steps.validation.outputs.reused }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify the pushed tree was validated in a successful PR
        id: validation
        run: node .github/scripts/reuse-pr-validation.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  static:
    needs: reuse
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.reuse.outputs.reused != 'true') }}
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      - name: Astro check
        run: pnpm check

  unit:
    needs: reuse
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.reuse.outputs.reused != 'true') }}
    name: Vitest tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Vitest unit, component and integration tests
        run: pnpm test

  build:
    needs: reuse
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.reuse.outputs.reused != 'true') }}
    name: D1 migrations and PR build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Verify local D1 migrations apply cleanly
        run: |
          pnpm d1:migrate:local:v2
      - name: Production build
        if: ${{ github.event_name != 'push' }}
        run: pnpm build
      - name: Record the validated PR tree
        if: ${{ github.event_name == 'pull_request' }}
        run: git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/validated-tree.txt"
      - name: Upload the validated PR tree
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: validated-tree
          path: ${{ runner.temp }}/validated-tree.txt
          retention-days: 7

  smoke:
    name: PR smoke E2E
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: container
      - name: Enable the test auth shim
        run: printf 'TEST_AUTH_ENABLED=true\n' > .dev.vars
      - name: Run smoke E2E
        run: pnpm test:e2e:smoke --reporter=dot,html
      - name: Run authentication smoke contracts
        run: pnpm test:e2e:auth --grep @smoke --reporter=dot,html --output=test-results/auth-smoke
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-auth-smoke
      - name: Upload failure report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-smoke
          path: |
            playwright-report/
            playwright-report-auth-smoke/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
