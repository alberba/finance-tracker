name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
    # Only prose is exempt; scripts and configuration under docs still need CI.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI: true
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# Validate the merge on main as well: it may differ from the PR's tested tree.
# Extensive browser regression belongs to browser-regression.yml, off the delivery path.
jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      - name: Astro check
        run: pnpm check

  unit:
    name: Vitest tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Vitest unit, component and integration tests
        run: pnpm test

  build:
    name: D1 migrations and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Verify local D1 migrations apply cleanly
        run: |
          pnpm d1:migrate:local:v2
      - name: Production build
        run: pnpm build

  smoke:
    name: PR smoke E2E
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: container
      - name: Enable the test auth shim
        run: printf 'TEST_AUTH_ENABLED=true\n' > .dev.vars
      - name: Run smoke E2E
        run: pnpm test:e2e:smoke --reporter=dot,html
      - name: Run authentication smoke contracts
        run: pnpm test:e2e:auth --grep @smoke --reporter=dot,html --output=test-results/auth-smoke
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-auth-smoke
      - name: Upload failure report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-smoke
          path: |
            playwright-report/
            playwright-report-auth-smoke/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
