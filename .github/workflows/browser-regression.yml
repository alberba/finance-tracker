name: Browser regression

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the Linux visual snapshots and commit them to this branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CI: true
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# Keep this image aligned with @playwright/test in package.json.
# These jobs never trigger production deployment.
jobs:
  e2e:
    name: Full E2E shard ${{ matrix.shard }}/4
    if: ${{ !inputs.update_snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: container
      - name: Enable the test auth shim
        run: printf 'TEST_AUTH_ENABLED=true\n' > .dev.vars
      - name: Run functional E2E shard
        run: pnpm test:e2e:shard ${{ matrix.shard }}/4
      - name: Upload blob report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-e2e-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: Visual E2E shard ${{ matrix.shard }}/3
    if: ${{ !inputs.update_snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: container
      - name: Enable the test auth shim
        run: printf 'TEST_AUTH_ENABLED=true\n' > .dev.vars
      - name: Run visual regression tests
        run: pnpm test:e2e:visual --shard=${{ matrix.shard }}/3
      - name: Upload visual blob report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-visual-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 7

  sync:
    name: Sync v2 E2E
    if: ${{ !inputs.update_snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: container
      - name: Enable the test auth shim
        run: printf 'TEST_AUTH_ENABLED=true\n' > .dev.vars
      - name: Generate an ephemeral integration encryption key
        run: node --input-type=module -e 'import { appendFileSync } from "node:fs"; import { randomBytes } from "node:crypto"; appendFileSync(".dev.vars", "DATA_ENCRYPTION_KEY=" + randomBytes(32).toString("base64") + "\n")'
      - name: Run sync-v2 E2E tests
        run: pnpm test:e2e:sync-v2
      - name: Upload sync-v2 blob report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-sync-v2
          path: blob-report-sync-v2/
          if-no-files-found: ignore
          retention-days: 7

  snapshots:
    name: Regenerate Linux snapshots
    if: ${{ inputs.update_snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: container
      - name: Enable the test auth shim
        run: printf 'TEST_AUTH_ENABLED=true\n' > .dev.vars
      - name: Regenerate and commit Linux snapshots
        run: |
          pnpm test:e2e:visual --update-snapshots
          git add 'tests/e2e/**/*-linux.png'
          if git diff --cached --quiet; then
            echo "Snapshots unchanged"
          else
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git config user.name 'github-actions[bot]'
            git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test(e2e): regenerate the Linux visual snapshots'
            git push
          fi

  authentication-e2e:
    name: Better Auth Worker and browser contracts
    if: ${{ !inputs.update_snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: container
      - name: Run isolated Better Auth Worker E2E
        run: pnpm test:e2e:auth --reporter=dot,html
      - name: Upload authentication report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-authentication
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  e2e-report:
    name: Merge failed Playwright report
    if: >-
      ${{
        always() &&
        (needs.e2e.result == 'failure' || needs.visual.result == 'failure' || needs.sync.result == 'failure')
      }}
    needs: [e2e, visual, sync]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Download blob reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload HTML report
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
