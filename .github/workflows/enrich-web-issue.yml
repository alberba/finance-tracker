name: Analyze web report

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Número del reporte web que se quiere analizar o reintentar
        type: number
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: enrich-web-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'source:web-report')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install OpenCode
        run: npm install --global @opencode/cli@2.2.0
      - name: Add context to the existing issue
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENCODE_CONFIG: ${{ github.workspace }}/.github/opencode-issue-enricher.json
        run: |
          test -n "$OPENCODE_GO_API_KEY" || { echo 'Falta el secret OPENCODE_GO_API_KEY'; exit 1; }
          {
            printf '@create-issue Añade contexto a la issue https://github.com/%s/issues/%s, que ya existe, y actualiza sus labels y estado de triage; no crees una issue nueva.\n\n' "$GITHUB_REPOSITORY" "$ISSUE_NUMBER"
            gh issue view "$ISSUE_NUMBER" --json title,body --jq '"Título: " + .title + "\n\nDescripción:\n\n" + .body' | sed '/^### Reportero$/,$d'
          } > "$RUNNER_TEMP/prompt.md"
          opencode run --standalone "$(cat "$RUNNER_TEMP/prompt.md")"
