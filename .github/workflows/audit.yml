name: Dependency audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        shell: bash
        run: pnpm audit:prod 2>&1 | tee audit.txt
      - name: Open an issue when the audit fails
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Auditoría de dependencias de producción en rojo'
          if gh issue list --state open --search "in:title \"$title\"" --json number --jq 'length' | grep -qx 0; then
            {
              echo "La auditoría semanal (\`pnpm audit:prod\`) ha fallado en \`${GITHUB_REF_NAME}\`: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              echo '```'
              tail -n 60 audit.txt
              echo '```'
            } > body.md
            gh issue create --title "$title" --body-file body.md --label needs-triage
          fi
