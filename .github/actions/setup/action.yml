name: Setup
description: pnpm, Node and frozen-lockfile install, with Chromium for Playwright on request

inputs:
  playwright:
    description: >-
      'true' installs Chromium and its system dependencies on the runner;
      'container' assumes the job runs in the official Playwright image and
      installs without native build scripts (the image has no toolchain).
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10.26.0
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      if: ${{ inputs.playwright != 'container' }}
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Install dependencies (Playwright image)
      if: ${{ inputs.playwright == 'container' }}
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
    - name: Cache Chromium
      if: ${{ inputs.playwright == 'true' }}
      id: chromium-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install Chromium
      if: ${{ inputs.playwright == 'true' && steps.chromium-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
    - name: Install Chromium system dependencies
      if: ${{ inputs.playwright == 'true' && steps.chromium-cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: pnpm exec playwright install-deps chromium
