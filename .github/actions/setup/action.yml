name: Setup
description: pnpm, Node and frozen-lockfile install, with Chromium for Playwright on request

inputs:
  playwright:
    description: >-
      'true' installs the Chromium and system dependencies matching the
      installed @playwright/test, restored from a cache keyed by its version.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pnpm
      shell: bash
      run: npm install --global pnpm@10.26.0
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Resolve the Playwright version
      if: ${{ inputs.playwright == 'true' }}
      id: playwright-version
      shell: bash
      run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
    - name: Cache Chromium
      if: ${{ inputs.playwright == 'true' }}
      id: chromium-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        # Only a new @playwright/test download invalidates the browser cache, so an
        # unrelated dependency bump does not pay for Chromium again.
        key: chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    - name: Install Chromium
      if: ${{ inputs.playwright == 'true' && steps.chromium-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
    - name: Install Chromium system dependencies
      if: ${{ inputs.playwright == 'true' && steps.chromium-cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: pnpm exec playwright install-deps chromium
