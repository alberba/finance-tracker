version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-security-updates:
        dependency-type: production
        update-types:
          - patch
          - minor
      development-security-updates:
        dependency-type: development
        update-types:
          - patch
          - minor
