scripts:
  setup: |
    set -eu
    export PATH="$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
    cd "$ORCA_WORKTREE_PATH"
    bun run setup:worktree
    bun run local:archive:install
  archive: |
    set -eu
    export PATH="$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
    node "$ORCA_ROOT_PATH/.data/orca/archive-local.mjs" "$ORCA_WORKTREE_PATH"
