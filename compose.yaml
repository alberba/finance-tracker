services:
  app:
    build: .
    ports:
      - '127.0.0.1:4321:4321'
    env_file: .env.selfhost
    volumes:
      - finance-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4321/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s

volumes:
  finance-data:
